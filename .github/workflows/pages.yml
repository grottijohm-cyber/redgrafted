name: Deploy phone client to GitHub Pages

on:
  push:
    branches:
      - cached-model-fix
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always publish the newest mobile client from the working branch.
      # Touching this workflow on main publishes the latest cached-model-fix UI.
      # Current deploy includes the simplified Create UI, local AI prompt enhancement
      # with preview/choice controls, the same enhancement flow for Extend, combined
      # original+continuation videos, easier mobile MP4 downloads, presets, queueing,
      # permanent private render archiving, details, cancellation, and library refresh.
      # Sync target: simplified UI + quality/camera/seed/end-frame/A-B controls + Ref2VA Turbo + best-frame chaining + named LoRAs.
      - name: Checkout phone client branch
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
