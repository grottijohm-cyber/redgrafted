name: Deploy phone client to GitHub Pages

on:
  push:
    branches:
      - cached-model-fix
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always publish the newest mobile client from the working branch.
      # Touching this workflow on main publishes the latest cached-model-fix UI.
      # Current deploy includes presets, multi-job queueing, local image persistence,
      # audio/GIMM controls, permanent private render archiving, video continuation
      # from archived final frames, the hamburger queue/videos drawer, render details,
      # cancellation controls, automatic library refresh, and compatible submissions.
      - name: Checkout phone client branch
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
