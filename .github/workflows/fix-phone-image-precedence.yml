name: Patch phone image precedence

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-phone-image-precedence.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix
          fetch-depth: 0
      - name: Prefer explicit image URL over cached local image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/app.js')
          s = p.read_text(encoding='utf-8')
          old = "const config=connection(),file=$('image').files[0]||savedImageBlob,url=$('imageUrl').value.trim()"
          new = "const config=connection(),url=$('imageUrl').value.trim(),file=url?null:($('image').files[0]||savedImageBlob)"
          if old not in s:
              raise SystemExit('expected submit-generation image selector not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate browser script
        run: node --check docs/app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.js
          git commit -m "Prefer explicit image URL over cached image"
          git push origin HEAD:cached-model-fix
