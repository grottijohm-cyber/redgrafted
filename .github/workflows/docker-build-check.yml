name: Docker build check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docker-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout cached-model-fix
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix
      - name: Build worker image
        # Validate runtime controls, permanent R2 archive/library, Audio/GIMM,
        # RealESRGAN photo/video upscaling, ffmpeg extension concatenation, and the
        # baked CPU llama.cpp prompt enhancer before the RunPod endpoint is rebuilt.
        # This run validates the final prompt-capture changes on cached-model-fix.
        run: docker build --progress=plain -t redgrafted-build-check .
