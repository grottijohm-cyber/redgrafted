name: Docker build check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docker-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# Validate: verified LoRA mirrors + safetensors headers + SHA pins.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout cached-model-fix
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix
      - name: Build worker image
        # Validate runtime controls, permanent R2 archive/library, Audio/GIMM,
        # optional RealESRGAN photo/video upscaling, seed lock, end-frame I2V, quality modes, real Ref2VA + Ref2V Turbo switching, ffmpeg extension concatenation,
        # zero-strength LoRA bypass, validated safetensors downloads (including fixed PlagueKind source), and retained prompt enhancement before RunPod.
        run: docker build --progress=plain -t redgrafted-build-check .
