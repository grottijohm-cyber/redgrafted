name: Apply MiniMax duration LoRA and GIMM upgrade

on:
  push:
    branches:
      - cached-model-fix
    paths:
      - '.github/workflows/apply-minimax-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cached-model-fix
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix
          fetch-depth: 0

      - name: Patch app and worker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Could not find expected {label}")
              return text.replace(old, new, 1)

          # Phone app: permanently remember endpoint + API key and add 0-60 s duration.
          page_path = Path('docs/index.html')
          page = page_path.read_text(encoding='utf-8')
          page = replace_once(
              page,
              '<div class="saved">For safety, the API key is kept only for the current browser session, not permanently stored.</div>',
              '<div class="saved">API key is remembered on this device until you tap Reset.</div>',
              'API key storage note',
          )
          page = replace_once(
              page,
              '''  </div>\n\n  <div class="card">\n    <div class="actions">''',
              '''  </div>\n\n  <div class="card">\n    <label for="duration">Video length (seconds)</label>\n    <input id="duration" type="number" min="0" max="60" step="1" inputmode="numeric" value="10">\n    <div class="hint">Choose 1–60 seconds. Set 0 to use the workflow default length.</div>\n  </div>\n\n  <div class="card">\n    <div class="actions">''',
              'duration card insertion',
          )
          page = replace_once(
              page,
              '''const STORAGE = {\n  endpoint:'redgraft-endpoint-v2',\n  prompt:'redgraft-prompt-v2',\n  imageUrl:'redgraft-image-url-v2',\n  job:'redgraft-job-v2'\n};\nconst SESSION_KEY='redgraft-runpod-key-v2';''',
              '''const STORAGE = {\n  endpoint:'redgraft-endpoint-v2',\n  key:'redgraft-runpod-key-v2',\n  prompt:'redgraft-prompt-v2',\n  imageUrl:'redgraft-image-url-v2',\n  duration:'redgraft-duration-v1',\n  job:'redgraft-job-v2'\n};''',
              'storage keys',
          )
          page = replace_once(
              page,
              '''  $('endpoint').disabled=busy;$('key').disabled=busy;''',
              '''  $('endpoint').disabled=busy;$('key').disabled=busy;$('duration').disabled=busy;''',
              'busy controls',
          )
          page = replace_once(
              page,
              '''  safeSet(localStorage,STORAGE.endpoint,endpoint);\n  safeSet(sessionStorage,SESSION_KEY,key);''',
              '''  safeSet(localStorage,STORAGE.endpoint,endpoint);\n  safeSet(localStorage,STORAGE.key,key);''',
              'connection persistence',
          )
          page = replace_once(
              page,
              '''$('key').addEventListener('input',()=>{safeSet(sessionStorage,SESSION_KEY,$('key').value.trim());updateBadge()});''',
              '''$('key').addEventListener('input',()=>{safeSet(localStorage,STORAGE.key,$('key').value.trim());updateBadge()});\n$('duration').addEventListener('input',()=>safeSet(localStorage,STORAGE.duration,$('duration').value));''',
              'key listener',
          )
          page = replace_once(
              page,
              '''  if(!confirm('Clear the saved endpoint, prompt, image URL, API key for this session, and saved job?'))return;\n  Object.values(STORAGE).forEach(k=>safeSet(localStorage,k,''));safeSet(sessionStorage,SESSION_KEY,'');\n  active=null;$('endpoint').value='';$('key').value='';$('prompt').value='';$('imageUrl').value='';$('image').value='';$('preview').hidden=true;$('job').textContent='';resetResults();updateBadge();message('Saved settings cleared.');controls(false);$('connection').open=true;''',
              '''  if(!confirm('Clear the saved endpoint, API key, prompt, image URL, video length, and saved job?'))return;\n  Object.values(STORAGE).forEach(k=>safeSet(localStorage,k,''));\n  active=null;$('endpoint').value='';$('key').value='';$('prompt').value='';$('imageUrl').value='';$('duration').value='10';$('image').value='';$('preview').hidden=true;$('job').textContent='';resetResults();updateBadge();message('Saved settings cleared.');controls(false);$('connection').open=true;''',
              'reset settings',
          )
          page = replace_once(
              page,
              '''    const config=connection(),file=$('image').files[0],url=$('imageUrl').value.trim(),prompt=$('prompt').value.trim();\n    if(!prompt)throw Error('Enter a prompt.');''',
              '''    const config=connection(),file=$('image').files[0],url=$('imageUrl').value.trim(),prompt=$('prompt').value.trim();\n    const duration=Number($('duration').value||0);\n    if(!Number.isFinite(duration)||duration<0||duration>60)throw Error('Video length must be from 0 to 60 seconds.');\n    if(!prompt)throw Error('Enter a prompt.');''',
              'submit duration validation',
          )
          page = replace_once(
              page,
              '''    safeSet(localStorage,STORAGE.prompt,prompt);if(url)safeSet(localStorage,STORAGE.imageUrl,url);\n    const image=file?await fileData(file):url;submitting=true;\n    const queued=await request(config,'/run',{input:{image,prompt},policy:{executionTimeout:7200000,ttl:86400000}});''',
              '''    safeSet(localStorage,STORAGE.prompt,prompt);safeSet(localStorage,STORAGE.duration,String(duration));if(url)safeSet(localStorage,STORAGE.imageUrl,url);\n    const image=file?await fileData(file):url;submitting=true;\n    const queued=await request(config,'/run',{input:{image,prompt,length_seconds:duration},policy:{executionTimeout:7200000,ttl:86400000}});''',
              'submit payload',
          )
          page = replace_once(
              page,
              '''  $('endpoint').value=safeGet(localStorage,STORAGE.endpoint);\n  $('key').value=safeGet(sessionStorage,SESSION_KEY);\n  $('prompt').value=safeGet(localStorage,STORAGE.prompt);\n  $('imageUrl').value=safeGet(localStorage,STORAGE.imageUrl);''',
              '''  $('endpoint').value=safeGet(localStorage,STORAGE.endpoint);\n  $('key').value=safeGet(localStorage,STORAGE.key);\n  $('prompt').value=safeGet(localStorage,STORAGE.prompt);\n  $('imageUrl').value=safeGet(localStorage,STORAGE.imageUrl);\n  $('duration').value=safeGet(localStorage,STORAGE.duration)||'10';''',
              'initial stored settings',
          )
          page_path.write_text(page, encoding='utf-8')

          # Worker: support per-request MiniMax duration and upgraded graph validation.
          worker_path = Path('worker.py')
          worker = worker_path.read_text(encoding='utf-8')
          worker = worker.replace('WORKER_VERSION = "runpod-minimax-5"', 'WORKER_VERSION = "runpod-minimax-6"', 1)
          start = worker.index('def minimax_workflow_details(')
          end = worker.index('def validate_model_configuration(', start)
          new_details = '''def minimax_workflow_details(workflow: dict[str, Any]) -> dict[str, Any]:\n    """Check the MiniMax frame grid, LoRA chain, sigma shift, and AV decode graph."""\n    validate_model_configuration(workflow)\n    try:\n        cond = workflow["364"]["inputs"]\n        frames = cond["length"]\n        generation_fps = 24.0\n        output_fps = float(workflow["370"]["inputs"]["fps"])\n        if type(frames) is not int or frames < 5 or frames % 17 != 5:\n            raise WorkerError("MiniMax requires 17*n+5 frames at 24 fps")\n        if output_fps <= 0:\n            raise WorkerError("MiniMax output frame rate must be positive")\n        for axis in ("width", "height"):\n            value = cond[axis]\n            if type(value) is not int or value < 32 or value % 32 or workflow["350"]["inputs"][axis] != value:\n                raise WorkerError("MiniMax image and canvas dimensions must match and be multiples of 32")\n        required = {\n            ("364", "clip"): ["387", 0], ("364", "vae"): ["385", 0],\n            ("364", "first_frame"): ["350", 0], ("350", "image"): ["395", 0],\n            ("390", "model"): ["384", 0], ("391", "model"): ["390", 0],\n            ("392", "model"): ["391", 0], ("393", "model"): ["392", 0],\n            ("394", "model"): ["393", 0],\n            ("388", "model"): ["394", 0], ("388", "conditioning"): ["364", 0],\n            ("397", "model"): ["394", 0], ("344", "guider"): ["388", 0],\n            ("344", "latent_image"): ["364", 1], ("344", "sigmas"): ["397", 0],\n            ("374", "samples"): ["344", 0], ("374", "vae"): ["385", 0],\n            ("358", "samples"): ["344", 0], ("358", "vae"): ["386", 0],\n            ("399", "gimmvfi_model"): ["398", 0], ("399", "images"): ["374", 0],\n            ("370", "images"): ["399", 0], ("370", "audio"): ["358", 0],\n        }\n        if any(workflow[n]["inputs"].get(k) != v for (n, k), v in required.items()):\n            raise WorkerError("MiniMax conditioning, adapter, interpolation, or AV decode connections are invalid")\n        if workflow["387"]["inputs"]["type"] != "minimax":\n            raise WorkerError("MiniMax requires its matching Qwen text encoder")\n        if workflow["352"]["inputs"]["sampler_name"] != "euler":\n            raise WorkerError("MiniMax upgraded profile requires Euler sampling")\n        if workflow["397"]["inputs"].get("scheduler") != "simple" or workflow["397"]["inputs"].get("steps") != 12:\n            raise WorkerError("MiniMax upgraded profile requires the simple 12-step schedule")\n        if workflow["390"]["inputs"]["strength_model"] != 0.5:\n            raise WorkerError("MiniMax turbo LoRA strength must be 0.5")\n        if workflow["394"].get("class_type") != "MiniMaxH3SigmaShift" or workflow["394"]["inputs"].get("shift_video") != 6.0:\n            raise WorkerError("MiniMax upgraded profile requires video sigma shift 6")\n        return {"model_profile": "minimax", "checkpoint": workflow["384"]["inputs"]["unet_name"],\n                "frames": frames, "fps": generation_fps, "output_fps": output_fps,\n                "duration_seconds": round(frames / generation_fps, 3),\n                "width": cond["width"], "height": cond["height"], "prompt_enhanced": False}\n    except (KeyError, TypeError, ValueError) as exc:\n        raise WorkerError("The MiniMax workflow configuration is incomplete") from exc\n\n\n'''
          worker = worker[:start] + new_details + worker[end:]
          old_validate = '''    if referenced != set(model_setup.ALL_MODEL_PATHS):\n        raise WorkerError(f"Workflow model files do not match MODEL_PROFILE={model_setup.MODEL_PROFILE}; remove an old WORKFLOW_PATH override")'''
          new_validate = '''    expected = set(model_setup.ALL_MODEL_PATHS)\n    if model_setup.MODEL_PROFILE == "minimax":\n        # V2 remains in the cached bundle for backward compatibility; V2.1 and\n        # the two additional adapters are embedded in the worker image.\n        expected.discard("loras/M3_Unlocked_V2.safetensors")\n        expected.update({\n            "loras/M3_Unlocked_V2.1.safetensors",\n            "loras/MysticXXX_MMH3-V4.safetensors",\n            "loras/HMNSFW-AIO-V2.5.safetensors",\n        })\n    if referenced != expected:\n        raise WorkerError(f"Workflow model files do not match MODEL_PROFILE={model_setup.MODEL_PROFILE}; remove an old WORKFLOW_PATH override")'''
          worker = replace_once(worker, old_validate, new_validate, 'model reference validation')
          marker = '''def handle_job(job: dict[str, Any]) -> dict[str, Any]:'''
          helper = '''def _minimax_frames_for_seconds(value: Any) -> int | None:\n    """Convert 0-60 seconds to the nearest valid MiniMax 17*n+5 frame count."""\n    if value is None:\n        return None\n    if isinstance(value, bool):\n        raise WorkerError("input.length_seconds must be a number from 0 to 60")\n    try:\n        seconds = float(value)\n    except (TypeError, ValueError) as exc:\n        raise WorkerError("input.length_seconds must be a number from 0 to 60") from exc\n    if not math.isfinite(seconds) or seconds < 0 or seconds > 60:\n        raise WorkerError("input.length_seconds must be between 0 and 60")\n    if seconds == 0:\n        return None\n    target_frames = seconds * 24.0\n    n = max(0, round((target_frames - 5) / 17))\n    return max(5, min(1433, 17 * n + 5))\n\n\n'''
          worker = replace_once(worker, marker, helper + marker, 'duration helper')
          worker = replace_once(
              worker,
              '''    if set(job_input) - {"image", "prompt"}:\n        return {"error": "Only input.image and input.prompt are supported"}''',
              '''    if set(job_input) - {"image", "prompt", "length_seconds"}:\n        return {"error": "Only input.image and input.prompt are supported, plus optional input.length_seconds"}''',
              'accepted job inputs',
          )
          worker = replace_once(
              worker,
              '''        workflow = copy.deepcopy(load_workflow())\n        configuration = workflow_details(workflow)''',
              '''        workflow = copy.deepcopy(load_workflow())\n        requested_frames = _minimax_frames_for_seconds(job_input.get("length_seconds"))\n        if requested_frames is not None:\n            if model_setup.MODEL_PROFILE != "minimax":\n                raise WorkerError("Custom video length is currently supported only for MODEL_PROFILE=minimax")\n            workflow["364"]["inputs"]["length"] = requested_frames\n        configuration = workflow_details(workflow)''',
              'per-job duration patch',
          )
          worker_path.write_text(worker, encoding='utf-8')

          # MiniMax API graph: portrait/no-crop, four-adapter chain, shift 6, 12-step Euler,
          # then GIMM-VFI x2 interpolation to 48 fps while preserving approximate duration.
          graph_path = Path('api-workflow-minimax.json')
          graph = json.loads(graph_path.read_text(encoding='utf-8'))
          graph['350']['inputs'].update({'width': 544, 'height': 960, 'crop': 'disabled'})
          graph['364']['inputs'].update({'width': 544, 'height': 960})
          graph['390']['inputs']['strength_model'] = 0.5
          graph['391'] = {
              'class_type': 'LoraLoaderModelOnly',
              'inputs': {'model': ['390', 0], 'lora_name': 'M3_Unlocked_V2.1.safetensors', 'strength_model': 0.5},
          }
          graph['392'] = {
              'class_type': 'LoraLoaderModelOnly',
              'inputs': {'model': ['391', 0], 'lora_name': 'MysticXXX_MMH3-V4.safetensors', 'strength_model': 1.0},
          }
          graph['393'] = {
              'class_type': 'LoraLoaderModelOnly',
              'inputs': {'model': ['392', 0], 'lora_name': 'HMNSFW-AIO-V2.5.safetensors', 'strength_model': 1.0},
          }
          graph['394'] = {
              'class_type': 'MiniMaxH3SigmaShift',
              'inputs': {'model': ['393', 0], 'shift_video': 6.0, 'shift_audio': 3.0},
          }
          graph['388']['inputs']['model'] = ['394', 0]
          graph['352']['inputs']['sampler_name'] = 'euler'
          graph['397']['inputs'] = {'model': ['394', 0], 'scheduler': 'simple', 'steps': 12, 'denoise': 1.0}
          graph['398'] = {
              'class_type': 'DownloadAndLoadGIMMVFIModel',
              'inputs': {'model': 'gimmvfi_r_arb_lpips_fp32.safetensors', 'precision': 'fp16', 'torch_compile': False},
          }
          graph['399'] = {
              'class_type': 'GIMMVFI_interpolate',
              'inputs': {
                  'gimmvfi_model': ['398', 0], 'images': ['374', 0], 'ds_factor': 1.0,
                  'interpolation_factor': 2, 'seed': 0, 'output_flows': False,
              },
          }
          graph['370']['inputs']['images'] = ['399', 0]
          graph['370']['inputs']['fps'] = 48.0
          graph_path.write_text(json.dumps(graph, indent=2) + '\n', encoding='utf-8')

          # Download the three user-selected LoRAs into the worker image with pinned hashes.
          Path('download_embedded_loras.py').write_text(r'''from __future__ import annotations
import hashlib
import os
from pathlib import Path
from urllib.request import Request, urlopen

FILES = (
    ("https://civarchive.com/api/download/models/3345855", "M3_Unlocked_V2.1.safetensors", "52cb409bd89bb5e9a69851c03a1197b3a5b5698c745b812e2f9813492cde7167"),
    ("https://civarchive.com/api/download/models/3266628", "MysticXXX_MMH3-V4.safetensors", "fc3e856d14c6c19557c888f48662d591e4794e281233ec0d987be5003068afba"),
    ("https://huggingface.co/Hearmeman/minimax-h3-loras/resolve/main/HMNSFW-AIO-V2.5.safetensors", "HMNSFW-AIO-V2.5.safetensors", "a07732a84fd733085eb5d910f602f918fa7a3658117116927e4329f5951a9d2d"),
)
TARGET = Path(os.getenv("COMFY_MODELS", "/comfyui/models")) / "loras"
TARGET.mkdir(parents=True, exist_ok=True)
for url, name, expected in FILES:
    path = TARGET / name
    h = hashlib.sha256()
    request = Request(url, headers={"User-Agent": "Mozilla/5.0 redgrafted-builder/1.0"})
    with urlopen(request, timeout=120) as response, path.open("wb") as output:
        while True:
            chunk = response.read(1024 * 1024)
            if not chunk:
                break
            output.write(chunk)
            h.update(chunk)
    digest = h.hexdigest()
    if digest != expected:
        path.unlink(missing_ok=True)
        raise RuntimeError(f"SHA-256 mismatch for {name}: {digest}")
    print(f"Ready: {name}")
''', encoding='utf-8')

          docker_path = Path('Dockerfile')
          docker = docker_path.read_text(encoding='utf-8')
          docker = replace_once(
              docker,
              '''RUN cd /comfyui && timeout 300 python main.py --quick-test-for-ci --cpu\nRUN mkdir -p /app''',
              '''RUN cd /comfyui && timeout 300 python main.py --quick-test-for-ci --cpu\nRUN git clone --depth=1 https://github.com/kijai/ComfyUI-GIMM-VFI.git /comfyui/custom_nodes/ComfyUI-GIMM-VFI \\\n    && uv pip install -r /comfyui/custom_nodes/ComfyUI-GIMM-VFI/requirements.txt\nRUN mkdir -p /app''',
              'GIMM-VFI installation',
          )
          docker = replace_once(
              docker,
              '''RUN uv pip install -r /app/requirements.txt\n\nCOPY api-workflow.json api-workflow-minimax.json /app/''',
              '''RUN uv pip install -r /app/requirements.txt\nCOPY download_embedded_loras.py /app/download_embedded_loras.py\nRUN python /app/download_embedded_loras.py\n\nCOPY api-workflow.json api-workflow-minimax.json /app/''',
              'embedded LoRA installation',
          )
          docker_path.write_text(docker, encoding='utf-8')
          PY

      - name: Run worker tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit upgraded files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html worker.py api-workflow-minimax.json Dockerfile download_embedded_loras.py
          git commit -m "Upgrade MiniMax app duration LoRAs and GIMM-VFI"
          git push origin HEAD:cached-model-fix
