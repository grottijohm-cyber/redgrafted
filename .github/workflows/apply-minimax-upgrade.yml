name: Run MiniMax upgrade on cached-model-fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-minimax-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cached-model-fix
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix
          fetch-depth: 0

      - name: Apply expanded MiniMax LoRA stack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # Update the API workflow without disturbing the existing GIMM-VFI or sigma-shift nodes.
          path = Path('api-workflow-minimax.json')
          graph = json.loads(path.read_text(encoding='utf-8'))

          expected = {
              '390': 'LoraLoaderModelOnly',
              '391': 'LoraLoaderModelOnly',
              '392': 'LoraLoaderModelOnly',
              '393': 'LoraLoaderModelOnly',
              '394': 'MiniMaxH3SigmaShift',
              '398': 'DownloadAndLoadGIMMVFIModel',
              '399': 'GIMMVFI_interpolate',
          }
          for node_id, class_type in expected.items():
              assert graph[node_id]['class_type'] == class_type, (node_id, graph[node_id]['class_type'])

          graph['390']['inputs']['strength_model'] = 0.85
          graph['391']['inputs'].update({
              'model': ['390', 0],
              'lora_name': 'M3_Unlocked_V2.1.safetensors',
              'strength_model': 0.5,
          })
          graph['392']['inputs'].update({
              'model': ['391', 0],
              'lora_name': 'MysticXXX_MMH3-V4.safetensors',
              'strength_model': 1.0,
          })
          graph['393']['inputs'].update({
              'model': ['392', 0],
              'lora_name': 'HMNSFW-AIO-V2.5.safetensors',
              'strength_model': 1.0,
          })
          graph['400'] = {
              'class_type': 'LoraLoaderModelOnly',
              'inputs': {
                  'model': ['393', 0],
                  'lora_name': 'vagassist_e40.safetensors',
                  'strength_model': 1.0,
              },
          }
          graph['401'] = {
              'class_type': 'LoraLoaderModelOnly',
              'inputs': {
                  'model': ['400', 0],
                  'lora_name': 'hmpussy_v6_epoch30.safetensors',
                  'strength_model': 0.35,
              },
          }
          graph['402'] = {
              'class_type': 'LoraLoaderModelOnly',
              'inputs': {
                  'model': ['401', 0],
                  'lora_name': 'HMCumshot_V1.0.safetensors',
                  'strength_model': 0.7,
              },
          }
          graph['394']['inputs']['model'] = ['402', 0]
          graph['394']['inputs']['shift_video'] = 6.0
          graph['352']['inputs']['sampler_name'] = 'euler'
          graph['397']['inputs'].update({
              'model': ['394', 0],
              'scheduler': 'simple',
              'steps': 8,
              'denoise': 1.0,
          })
          graph['388']['inputs']['model'] = ['394', 0]
          path.write_text(json.dumps(graph, indent=2) + '\n', encoding='utf-8')

          # Expand the build-time LoRA downloader. These public mirrors are SHA-pinned.
          Path('download_embedded_loras.py').write_text('''from __future__ import annotations

import hashlib
import os
from pathlib import Path
from urllib.request import Request, urlopen

FILES = (
    (
        "https://civarchive.com/api/download/models/3345855",
        "M3_Unlocked_V2.1.safetensors",
        "52cb409bd89bb5e9a69851c03a1197b3a5b5698c745b812e2f9813492cde7167",
    ),
    (
        "https://civarchive.com/api/download/models/3266628",
        "MysticXXX_MMH3-V4.safetensors",
        "fc3e856d14c6c19557c888f48662d591e4794e281233ec0d987be5003068afba",
    ),
    (
        "https://huggingface.co/Hearmeman/minimax-h3-loras/resolve/main/HMNSFW-AIO-V2.5.safetensors",
        "HMNSFW-AIO-V2.5.safetensors",
        "a07732a84fd733085eb5d910f602f918fa7a3658117116927e4329f5951a9d2d",
    ),
    (
        "https://huggingface.co/Hearmeman/minimax-h3-loras/resolve/main/vagassist_e40.safetensors",
        "vagassist_e40.safetensors",
        "2c2fdb66bf558de1aabda504a81d4ada5f4cebc20e8f519dc6ed3bb6d4be8c9a",
    ),
    (
        "https://huggingface.co/Hearmeman/minimax-h3-loras/resolve/main/hmpussy_v6_epoch30.safetensors",
        "hmpussy_v6_epoch30.safetensors",
        "3080f4fbcbba4fc06bd09240c7eedb6a5128eb0e19feb001cdf97a7a0941a6ee",
    ),
    (
        "https://huggingface.co/Hearmeman/minimax-h3-loras/resolve/main/HMCumshot_V1.0.safetensors",
        "HMCumshot_V1.0.safetensors",
        "634c39cfcbfd9421a2d7b5adc62573fc232384c4c75e003c2e11d3408ad0765c",
    ),
)

TARGET = Path(os.getenv("COMFY_MODELS", "/comfyui/models")) / "loras"
TARGET.mkdir(parents=True, exist_ok=True)

for url, name, expected in FILES:
    path = TARGET / name
    digest = hashlib.sha256()
    request = Request(url, headers={"User-Agent": "Mozilla/5.0 redgrafted-builder/1.0"})
    with urlopen(request, timeout=180) as response, path.open("wb") as output:
        while True:
            chunk = response.read(1024 * 1024)
            if not chunk:
                break
            output.write(chunk)
            digest.update(chunk)
    actual = digest.hexdigest()
    if actual != expected:
        path.unlink(missing_ok=True)
        raise RuntimeError(f"SHA-256 mismatch for {name}: {actual}")
    print(f"Ready: {name}")
''', encoding='utf-8')

          # Keep worker-side validation synchronized with the graph.
          worker = Path('worker.py')
          source = worker.read_text(encoding='utf-8')

          replacements = [
              ('WORKER_VERSION = "runpod-minimax-6"', 'WORKER_VERSION = "runpod-minimax-7"'),
              ('''            ("392", "model"): ["391", 0], ("393", "model"): ["392", 0],
            ("394", "model"): ["393", 0],
            ("388", "model"): ["394", 0], ("388", "conditioning"): ["364", 0],''', '''            ("392", "model"): ["391", 0], ("393", "model"): ["392", 0],
            ("400", "model"): ["393", 0], ("401", "model"): ["400", 0],
            ("402", "model"): ["401", 0], ("394", "model"): ["402", 0],
            ("388", "model"): ["394", 0], ("388", "conditioning"): ["364", 0],'''),
              ('''        if workflow["397"]["inputs"].get("scheduler") != "simple" or workflow["397"]["inputs"].get("steps") != 12:
            raise WorkerError("MiniMax upgraded profile requires the simple 12-step schedule")
        if workflow["390"]["inputs"]["strength_model"] != 0.5:
            raise WorkerError("MiniMax turbo LoRA strength must be 0.5")''', '''        if workflow["397"]["inputs"].get("scheduler") != "simple" or workflow["397"]["inputs"].get("steps") != 8:
            raise WorkerError("MiniMax expanded profile requires the simple 8-step schedule")
        expected_loras = {
            "390": ("minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors", 0.85),
            "391": ("M3_Unlocked_V2.1.safetensors", 0.5),
            "392": ("MysticXXX_MMH3-V4.safetensors", 1.0),
            "393": ("HMNSFW-AIO-V2.5.safetensors", 1.0),
            "400": ("vagassist_e40.safetensors", 1.0),
            "401": ("hmpussy_v6_epoch30.safetensors", 0.35),
            "402": ("HMCumshot_V1.0.safetensors", 0.7),
        }
        for node_id, (name, strength) in expected_loras.items():
            inputs = workflow[node_id]["inputs"]
            if inputs.get("lora_name") != name or inputs.get("strength_model") != strength:
                raise WorkerError(f"MiniMax LoRA node {node_id} must use {name} at strength {strength}")'''),
              ('''        # V2 remains in the cached bundle for backward compatibility; V2.1 and
        # the two additional adapters are embedded in the worker image.
        expected.discard("loras/M3_Unlocked_V2.safetensors")
        expected.update({
            "loras/M3_Unlocked_V2.1.safetensors",
            "loras/MysticXXX_MMH3-V4.safetensors",
            "loras/HMNSFW-AIO-V2.5.safetensors",
        })''', '''        # V2 remains in the cached bundle for backward compatibility; the active
        # expanded adapter stack is embedded in the worker image.
        expected.discard("loras/M3_Unlocked_V2.safetensors")
        expected.update({
            "loras/M3_Unlocked_V2.1.safetensors",
            "loras/MysticXXX_MMH3-V4.safetensors",
            "loras/HMNSFW-AIO-V2.5.safetensors",
            "loras/vagassist_e40.safetensors",
            "loras/hmpussy_v6_epoch30.safetensors",
            "loras/HMCumshot_V1.0.safetensors",
        })'''),
          ]
          for old, new in replacements:
              if old not in source:
                  raise RuntimeError('worker.py changed; expected patch target not found:\n' + old[:180])
              source = source.replace(old, new, 1)
          worker.write_text(source, encoding='utf-8')
          PY

      - name: Validate patched files
        shell: bash
        run: |
          python -m py_compile worker.py download_embedded_loras.py
          MODEL_PROFILE=minimax python - <<'PY'
          import json
          import worker
          graph = worker.load_workflow()
          info = worker.workflow_details(graph)
          assert info['model_profile'] == 'minimax'
          assert graph['390']['inputs']['strength_model'] == 0.85
          assert graph['391']['inputs']['strength_model'] == 0.5
          assert graph['392']['inputs']['strength_model'] == 1.0
          assert graph['393']['inputs']['strength_model'] == 1.0
          assert graph['400']['inputs']['strength_model'] == 1.0
          assert graph['401']['inputs']['strength_model'] == 0.35
          assert graph['402']['inputs']['strength_model'] == 0.7
          assert graph['397']['inputs']['steps'] == 8
          assert graph['394']['inputs']['shift_video'] == 6.0
          print('Expanded MiniMax stack validated')
          PY

      - name: Commit upgraded files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.py api-workflow-minimax.json download_embedded_loras.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add anatomy and action LoRAs to MiniMax stack"
          git push origin HEAD:cached-model-fix
