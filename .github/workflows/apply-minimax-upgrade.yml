name: Apply runtime controls on cached-model-fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-minimax-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cached-model-fix
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix
          fetch-depth: 0

      - name: Apply runtime controls and progress UI
        run: python apply_runtime_ui.py

      - name: Validate patched files
        shell: bash
        run: |
          python -m py_compile worker.py runtime_controls.py comfy_progress.py
          python - <<'PY'
          from pathlib import Path
          import re

          worker = Path('worker.py').read_text()
          page = Path('docs/index.html').read_text()
          assert 'WORKER_VERSION = "runpod-minimax-8"' in worker
          assert 'apply_minimax_runtime_options(workflow, job_input)' in worker
          assert 'ComfyProgressTracker(COMFY_URL, job, prompt_id, client_id, report_progress)' in worker
          for name in ('turbo_strength','m3_strength','mystic_strength','hmnsfw_strength','vagassist_strength','hmpussy_strength','cumshot_strength'):
              assert name in worker or name in Path('runtime_controls.py').read_text()
              assert name in page
          match = re.search(r'<script>([\s\S]*?)</script>', page)
          assert match
          Path('/tmp/redgraft-page.js').write_text(match.group(1))
          print('Runtime controls patch validated')
          PY
          node --check /tmp/redgraft-page.js

      - name: Commit runtime controls
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.py docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add runtime MiniMax sliders and progress tracking"
          git push origin HEAD:cached-model-fix
