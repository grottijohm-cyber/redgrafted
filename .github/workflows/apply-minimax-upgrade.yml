name: Run MiniMax upgrade on cached-model-fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-minimax-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cached-model-fix
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix
          fetch-depth: 0

      - name: Execute upgrade patch stored on branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-minimax-upgrade.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          extracted = workflow[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in extracted.splitlines())
          exec(compile(code, 'embedded-minimax-upgrade.py', 'exec'))
          PY

      - name: Normalize embedded LoRA downloader
        shell: bash
        run: |
          cat > download_embedded_loras.py <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          FILES = (
              (
                  "https://civarchive.com/api/download/models/3345855",
                  "M3_Unlocked_V2.1.safetensors",
                  "52cb409bd89bb5e9a69851c03a1197b3a5b5698c745b812e2f9813492cde7167",
              ),
              (
                  "https://civarchive.com/api/download/models/3266628",
                  "MysticXXX_MMH3-V4.safetensors",
                  "fc3e856d14c6c19557c888f48662d591e4794e281233ec0d987be5003068afba",
              ),
              (
                  "https://huggingface.co/Hearmeman/minimax-h3-loras/resolve/main/HMNSFW-AIO-V2.5.safetensors",
                  "HMNSFW-AIO-V2.5.safetensors",
                  "a07732a84fd733085eb5d910f602f918fa7a3658117116927e4329f5951a9d2d",
              ),
          )

          TARGET = Path(os.getenv("COMFY_MODELS", "/comfyui/models")) / "loras"
          TARGET.mkdir(parents=True, exist_ok=True)

          for url, name, expected in FILES:
              path = TARGET / name
              digest = hashlib.sha256()
              request = Request(url, headers={"User-Agent": "Mozilla/5.0 redgrafted-builder/1.0"})
              with urlopen(request, timeout=120) as response, path.open("wb") as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      output.write(chunk)
                      digest.update(chunk)
              actual = digest.hexdigest()
              if actual != expected:
                  path.unlink(missing_ok=True)
                  raise RuntimeError(f"SHA-256 mismatch for {name}: {actual}")
              print(f"Ready: {name}")
          PY

      - name: Compile patched Python
        run: python -m py_compile worker.py download_embedded_loras.py

      - name: Commit upgraded files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html worker.py api-workflow-minimax.json Dockerfile download_embedded_loras.py
          git commit -m "Upgrade MiniMax app duration LoRAs and GIMM-VFI"
          git push origin HEAD:cached-model-fix
