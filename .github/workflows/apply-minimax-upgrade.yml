name: Run MiniMax upgrade on cached-model-fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-minimax-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cached-model-fix
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix
          fetch-depth: 0

      - name: Apply expanded MiniMax stack
        run: python apply_expanded_stack.py

      - name: Validate patched files
        shell: bash
        run: |
          python -m py_compile worker.py download_embedded_loras.py
          MODEL_PROFILE=minimax python - <<'PY'
          from pathlib import Path
          import worker
          graph = worker.load_workflow(Path('api-workflow-minimax.json'))
          info = worker.workflow_details(graph)
          assert info['model_profile'] == 'minimax'
          assert graph['390']['inputs']['strength_model'] == 0.85
          assert graph['391']['inputs']['strength_model'] == 0.5
          assert graph['392']['inputs']['strength_model'] == 1.0
          assert graph['393']['inputs']['strength_model'] == 1.0
          assert graph['400']['inputs']['strength_model'] == 1.0
          assert graph['401']['inputs']['strength_model'] == 0.35
          assert graph['402']['inputs']['strength_model'] == 0.7
          assert graph['397']['inputs']['steps'] == 8
          assert graph['394']['inputs']['shift_video'] == 6.0
          print('Expanded MiniMax stack validated')
          PY

      - name: Commit upgraded files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.py api-workflow-minimax.json download_embedded_loras.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add anatomy and action LoRAs to MiniMax stack"
          git push origin HEAD:cached-model-fix
