name: Apply audio and GIMM toggles

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-av-toggles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix
          fetch-depth: 0

      - name: Patch runtime controls and UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected marker: {label}')
              return text.replace(old, new, 1)

          # Backend runtime controls
          p = Path('runtime_controls.py')
          s = p.read_text()
          s = replace_once(
              s,
              'MINIMAX_RUNTIME_OPTION_NAMES = frozenset({*LORA_OPTIONS, "steps"})',
              'MINIMAX_RUNTIME_OPTION_NAMES = frozenset({*LORA_OPTIONS, "steps", "enable_audio", "enable_gimm"})',
              'runtime option names',
          )
          s = replace_once(
              s,
              'def apply_minimax_runtime_options(workflow: dict[str, Any], job_input: dict[str, Any]) -> dict[str, Any]:',
              '''def _boolean(value: Any, name: str, default: bool) -> bool:\n    if value is None:\n        return default\n    if isinstance(value, bool):\n        return value\n    if value in (0, 1):\n        return bool(value)\n    if isinstance(value, str):\n        lowered = value.strip().lower()\n        if lowered in {"true", "1", "yes", "on"}:\n            return True\n        if lowered in {"false", "0", "no", "off"}:\n            return False\n    raise ValueError(f"input.{name} must be true or false")\n\n\ndef apply_minimax_runtime_options(workflow: dict[str, Any], job_input: dict[str, Any]) -> dict[str, Any]:''',
              'boolean helper',
          )
          s = replace_once(
              s,
              '    applied["steps"] = steps\n    return applied\n',
              '''    applied["steps"] = steps\n\n    audio_enabled = _boolean(job_input.get("enable_audio"), "enable_audio", True)\n    gimm_enabled = _boolean(job_input.get("enable_gimm"), "enable_gimm", True)\n    try:\n        create_video = workflow["370"]["inputs"]\n        if gimm_enabled:\n            create_video["images"] = ["399", 0]\n            create_video["fps"] = 48.0\n        else:\n            create_video["images"] = ["374", 0]\n            create_video["fps"] = 24.0\n        if audio_enabled:\n            create_video["audio"] = ["358", 0]\n        else:\n            create_video.pop("audio", None)\n    except (KeyError, TypeError) as exc:\n        raise ValueError("MiniMax CreateVideo node 370 is missing") from exc\n\n    applied["enable_audio"] = audio_enabled\n    applied["enable_gimm"] = gimm_enabled\n    return applied\n''',
              'runtime AV patch',
          )
          p.write_text(s)

          # Worker version bump
          p = Path('worker.py')
          s = p.read_text()
          s = replace_once(s, 'WORKER_VERSION = "runpod-minimax-8"', 'WORKER_VERSION = "runpod-minimax-9"', 'worker version')
          p.write_text(s)

          # Unit tests
          p = Path('tests/test_runtime_controls.py')
          s = p.read_text()
          s = replace_once(
              s,
              '        self.assertEqual(applied["steps"], 8)\n',
              '''        self.assertEqual(applied["steps"], 8)\n        self.assertTrue(applied["enable_audio"])\n        self.assertTrue(applied["enable_gimm"])\n        self.assertEqual(workflow["370"]["inputs"]["audio"], ["358", 0])\n        self.assertEqual(workflow["370"]["inputs"]["images"], ["399", 0])\n        self.assertEqual(workflow["370"]["inputs"]["fps"], 48.0)\n''',
              'default AV assertions',
          )
          marker = '    def test_rejects_out_of_range_values(self):\n'
          test = '''    def test_audio_and_gimm_can_be_disabled(self):\n        workflow = self.workflow()\n        applied = apply_minimax_runtime_options(\n            workflow, {"enable_audio": False, "enable_gimm": False}\n        )\n        self.assertFalse(applied["enable_audio"])\n        self.assertFalse(applied["enable_gimm"])\n        self.assertNotIn("audio", workflow["370"]["inputs"])\n        self.assertEqual(workflow["370"]["inputs"]["images"], ["374", 0])\n        self.assertEqual(workflow["370"]["inputs"]["fps"], 24.0)\n\n'''
          s = replace_once(s, marker, test + marker, 'AV unit test insertion')
          p.write_text(s)

          # Mobile client UI
          p = Path('docs/index.html')
          s = p.read_text()
          s = replace_once(
              s,
              '[hidden]{display:none!important}',
              '.toggle-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:1 1 220px;padding:12px 13px;border:1px solid #39435a;border-radius:12px;background:#101521}.toggle span{font-weight:700}.toggle input{width:22px;height:22px;accent-color:#c4baff}\n[hidden]{display:none!important}',
              'toggle CSS',
          )
          steps_html = '    <div class="setting"><div class="slider-head"><span>Sampling steps</span><output id="stepsValue">8</output></div><input id="steps" type="range" min="4" max="16" step="1" value="8"></div>\n'
          switches_html = steps_html + '''    <div class="toggle-row">\n      <label class="toggle" for="enableAudio"><span>Audio</span><input id="enableAudio" type="checkbox" checked></label>\n      <label class="toggle" for="enableGimm"><span>GIMM interpolation</span><input id="enableGimm" type="checkbox" checked></label>\n    </div>\n    <div class="hint">Audio and GIMM are saved on this device and inside custom presets. Turning GIMM off outputs at the native 24 fps instead of interpolated 48 fps.</div>\n'''
          s = replace_once(s, steps_html, switches_html, 'AV switches HTML')
          s = replace_once(
              s,
              "  selectedPreset:'redgraft-selected-preset-v1'\n};",
              "  selectedPreset:'redgraft-selected-preset-v1',\n  enableAudio:'redgraft-enable-audio-v1',\n  enableGimm:'redgraft-enable-gimm-v1'\n};",
              'AV storage keys',
          )
          replacements = {
              "{name:'Fast Test',duration:8,turbo_strength:.85,m3_strength:.40,mystic_strength:0,hmnsfw_strength:0,vagassist_strength:0,hmpussy_strength:0,cumshot_strength:0,steps:6}": "{name:'Fast Test',duration:8,turbo_strength:.85,m3_strength:.40,mystic_strength:0,hmnsfw_strength:0,vagassist_strength:0,hmpussy_strength:0,cumshot_strength:0,steps:6,enable_audio:false,enable_gimm:false}",
              "{name:'General NSFW',duration:8,turbo_strength:.85,m3_strength:.50,mystic_strength:.55,hmnsfw_strength:.55,vagassist_strength:0,hmpussy_strength:0,cumshot_strength:0,steps:8}": "{name:'General NSFW',duration:8,turbo_strength:.85,m3_strength:.50,mystic_strength:.55,hmnsfw_strength:.55,vagassist_strength:0,hmpussy_strength:0,cumshot_strength:0,steps:8,enable_audio:false,enable_gimm:false}",
              "{name:'Anatomy Lock',duration:8,turbo_strength:.85,m3_strength:.45,mystic_strength:.60,hmnsfw_strength:.60,vagassist_strength:1.00,hmpussy_strength:.35,cumshot_strength:0,steps:8}": "{name:'Anatomy Lock',duration:8,turbo_strength:.85,m3_strength:.45,mystic_strength:.60,hmnsfw_strength:.60,vagassist_strength:1.00,hmpussy_strength:.35,cumshot_strength:0,steps:8,enable_audio:false,enable_gimm:false}",
              "{name:'HMNSFW Focus',duration:8,turbo_strength:.50,m3_strength:.35,mystic_strength:.70,hmnsfw_strength:1.00,vagassist_strength:.75,hmpussy_strength:.25,cumshot_strength:0,steps:12}": "{name:'HMNSFW Focus',duration:8,turbo_strength:.50,m3_strength:.35,mystic_strength:.70,hmnsfw_strength:1.00,vagassist_strength:.75,hmpussy_strength:.25,cumshot_strength:0,steps:12,enable_audio:false,enable_gimm:false}",
              "{name:'Cumshot I2V',duration:8,turbo_strength:.85,m3_strength:.40,mystic_strength:.70,hmnsfw_strength:.70,vagassist_strength:1.00,hmpussy_strength:.35,cumshot_strength:.70,steps:8}": "{name:'Cumshot I2V',duration:8,turbo_strength:.85,m3_strength:.40,mystic_strength:.70,hmnsfw_strength:.70,vagassist_strength:1.00,hmpussy_strength:.35,cumshot_strength:.70,steps:8,enable_audio:false,enable_gimm:false}",
              "{name:'Full Stack',duration:8,turbo_strength:.85,m3_strength:.50,mystic_strength:1.00,hmnsfw_strength:1.00,vagassist_strength:1.00,hmpussy_strength:.35,cumshot_strength:.70,steps:8}": "{name:'Full Stack',duration:8,turbo_strength:.85,m3_strength:.50,mystic_strength:1.00,hmnsfw_strength:1.00,vagassist_strength:1.00,hmpussy_strength:.35,cumshot_strength:.70,steps:8,enable_audio:true,enable_gimm:true}",
          }
          for old, new in replacements.items():
              s = replace_once(s, old, new, 'built-in preset AV state')
          s = replace_once(
              s,
              "function runtimeInput(){return {turbo_strength:Number($('turboStrength').value),m3_strength:Number($('m3Strength').value),mystic_strength:Number($('mysticStrength').value),hmnsfw_strength:Number($('hmnsfwStrength').value),vagassist_strength:Number($('vagassistStrength').value),hmpussy_strength:Number($('hmpussyStrength').value),cumshot_strength:Number($('cumshotStrength').value),steps:Number($('steps').value)}}",
              "function runtimeInput(){return {turbo_strength:Number($('turboStrength').value),m3_strength:Number($('m3Strength').value),mystic_strength:Number($('mysticStrength').value),hmnsfw_strength:Number($('hmnsfwStrength').value),vagassist_strength:Number($('vagassistStrength').value),hmpussy_strength:Number($('hmpussyStrength').value),cumshot_strength:Number($('cumshotStrength').value),steps:Number($('steps').value),enable_audio:$('enableAudio').checked,enable_gimm:$('enableGimm').checked}}",
              'runtime input AV values',
          )
          s = replace_once(
              s,
              "function currentPresetSettings(){return {duration:Number($('duration').value||0),...runtimeInput()}}",
              "function currentPresetSettings(){return {duration:Number($('duration').value||0),...runtimeInput()}}",
              'preset settings marker',
          )
          s = replace_once(
              s,
              "  if(Number.isFinite(Number(preset.duration)))$('duration').value=String(preset.duration);\n  persistSliderValues();safeSet(localStorage,STORAGE.duration,$('duration').value);",
              "  if(Number.isFinite(Number(preset.duration)))$('duration').value=String(preset.duration);\n  if(typeof preset.enable_audio==='boolean')$('enableAudio').checked=preset.enable_audio;\n  if(typeof preset.enable_gimm==='boolean')$('enableGimm').checked=preset.enable_gimm;\n  persistSliderValues();safeSet(localStorage,STORAGE.duration,$('duration').value);safeSet(localStorage,STORAGE.enableAudio,$('enableAudio').checked?'1':'0');safeSet(localStorage,STORAGE.enableGimm,$('enableGimm').checked?'1':'0');",
              'apply preset AV values',
          )
          s = replace_once(
              s,
              "  $('endpoint').disabled=busy;$('key').disabled=busy;$('duration').disabled=busy;",
              "  $('endpoint').disabled=busy;$('key').disabled=busy;$('duration').disabled=busy;$('enableAudio').disabled=busy;$('enableGimm').disabled=busy;",
              'disable switches while busy',
          )
          s = replace_once(
              s,
              "$('duration').addEventListener('input',()=>safeSet(localStorage,STORAGE.duration,$('duration').value));",
              "$('duration').addEventListener('input',()=>safeSet(localStorage,STORAGE.duration,$('duration').value));\n$('enableAudio').addEventListener('change',()=>safeSet(localStorage,STORAGE.enableAudio,$('enableAudio').checked?'1':'0'));\n$('enableGimm').addEventListener('change',()=>safeSet(localStorage,STORAGE.enableGimm,$('enableGimm').checked?'1':'0'));",
              'switch listeners',
          )
          s = replace_once(
              s,
              "  resetRuntimeSliders();clearProgress();renderPresetOptions('builtin:General NSFW');",
              "  resetRuntimeSliders();$('enableAudio').checked=true;$('enableGimm').checked=true;clearProgress();renderPresetOptions('builtin:General NSFW');",
              'reset switches',
          )
          s = replace_once(
              s,
              "  bindRuntimeSliders();renderPresetOptions();clearProgress();",
              "  bindRuntimeSliders();$('enableAudio').checked=(safeGet(localStorage,STORAGE.enableAudio)||'1')==='1';$('enableGimm').checked=(safeGet(localStorage,STORAGE.enableGimm)||'1')==='1';renderPresetOptions();clearProgress();",
              'initialize switches',
          )
          p.write_text(s)
          PY

      - name: Validate changes
        shell: bash
        run: |
          python -m unittest tests.test_runtime_controls
          python - <<'PY'
          from pathlib import Path
          html = Path('docs/index.html').read_text()
          required = ['id="enableAudio"', 'id="enableGimm"', 'enable_audio', 'enable_gimm', 'Fast Test', 'General NSFW', 'Anatomy Lock', 'HMNSFW Focus', 'Cumshot I2V', 'Full Stack']
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Missing expected UI pieces: ' + ', '.join(missing))
          script = html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/index.js').write_text(script)
          PY
          node --check /tmp/index.js
          python -m py_compile runtime_controls.py worker.py

      - name: Commit update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_controls.py worker.py tests/test_runtime_controls.py docs/index.html
          git commit -m 'Add audio and GIMM runtime toggles'
          git push origin HEAD:cached-model-fix
