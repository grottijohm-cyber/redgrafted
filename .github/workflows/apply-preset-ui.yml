name: Apply preset UI update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-preset-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: cached-model-fix
          fetch-depth: 0

      - name: Verify expected UI version
        shell: bash
        run: |
          test "$(git hash-object docs/index.html)" = "1da71fdef4fc2c564ecbd08ab53d9db97bf20ecb"

      - name: Apply preset and local-image update
        shell: bash
        run: |
          cat > /tmp/preset.patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/preset.patch.gz.b64 | gzip -d > /tmp/preset.patch
          git apply --check /tmp/preset.patch
          git apply /tmp/preset.patch

      - name: Validate browser script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('docs/index.html').read_text()
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/index.js').write_text(script)
          required = ['Fast Test','General NSFW','Anatomy Lock','HMNSFW Focus','Cumshot I2V','Full Stack','Save Preset','Add New Preset','Delete Preset','indexedDB']
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing UI items: ' + ', '.join(missing))
          PY
          node --check /tmp/index.js

      - name: Commit update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'Add stack presets and persistent local image'
          git push origin HEAD:cached-model-fix
