name: Worker checks
on:
  pull_request:
  push:
    branches: [cached-model-fix, codex/runpod-reliability]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_client.cjs
      - run: bash -n start-worker.sh
      - run: python -m compileall -q handler.py worker.py model_setup.py bootstrap_hf_repo.py file_integrity.py video_delivery.py
