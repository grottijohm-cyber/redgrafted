name: Validate upgraded MiniMax branch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-cached-minimax.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cached-model-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_client.cjs
      - run: bash -n start-worker.sh
      - run: python -m compileall -q handler.py worker.py model_setup.py bootstrap_hf_repo.py file_integrity.py video_delivery.py runtime_health.py comfy_launcher.py configure_startup.py download_embedded_loras.py
